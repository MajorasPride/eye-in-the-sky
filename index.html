<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eye in the Sky: Sacramento (prototype)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0f14;color:#e8eef5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:6px 8px 14px;pointer-events:none;background:linear-gradient(#000d,#0000)}
#title{font-weight:700;font-size:14px}
#obj{font-size:12px;color:#ffd479;margin-top:1px}
#squad{display:flex;gap:4px;margin-top:5px}
.card{flex:1;background:#111a24d9;border:1px solid #2a3a4a;border-radius:6px;padding:3px 5px;font-size:10px;min-width:0;line-height:1.25}

.card.dead{opacity:.35}
.bar{height:4px;background:#333;border-radius:2px;margin-top:2px;overflow:hidden}

#tools{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px;background:linear-gradient(#0000,#000e);overflow-x:auto}
.tool{flex:1 0 auto;min-width:60px;padding:6px 4px;border-radius:9px;border:1px solid #2f4152;background:#15212d;color:#e8eef5;font-size:11px;font-weight:600;position:relative;text-align:center}
.tool.sel{border-color:#ffd479;background:#2a2410}
.tool .cd{position:absolute;inset:0;border-radius:9px;background:#000b;display:flex;align-items:center;justify-content:center;font-size:13px}

#toast{position:fixed;top:32%;left:0;right:0;text-align:center;font-weight:800;font-size:19px;text-shadow:0 2px 6px #000,0 0 2px #000;pointer-events:none;padding:0 20px}
#centerBtn{position:fixed;right:8px;bottom:80px;padding:7px 11px;border-radius:8px;background:#15212d;border:1px solid #2f4152;color:#e8eef5;font-size:12px}
.overlay{position:fixed;inset:0;background:#05080cf2;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.box{max-width:460px;width:100%;background:#111a24;border:1px solid #2f4152;border-radius:12px;padding:18px;font-size:14px;line-height:1.45;max-height:92vh;overflow:auto}
.box h1{font-size:21px;margin-bottom:4px}
.box h2{font-size:15px;margin:12px 0 4px;color:#ffd479}
.box ul{padding-left:18px}
.box p{margin-top:4px}

.btn.alt{background:#2a3a4a;color:#e8eef5}
.hidden{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><div id="title"></div><div id="obj"></div><div id="squad"></div></div>
<div id="toast"></div>
<button id="centerBtn">⌖ Center</button>
<div id="tools"></div>

<div id="ov" class="overlay"><div class="box" id="ovBox"></div></div>

<script>
'use strict';
// ===== Setup =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,sc=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const P=(x,y)=>({x,y});
function nearestOnSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=clamp(t,0,1);return{x:a.x+dx*t,y:a.y+dy*t};}
const seg=(ax,ay,bx,by,r,flag)=>({a:P(ax,ay),b:P(bx,by),r,flag});

// ===== Levels (Sacramento) =====
const LEVELS=[
{name:'1 · Highway 50 Overpasses',
 intro:'Survivors are stuck on US-50 heading west. Zombies drop down off the ramps. Read the ramps and call it.',
 route:[P(0,0),P(600,-40),P(1200,0),P(1800,80),P(2400,0)],
 segs:[seg(-150,0,0,0,70,'lane'),seg(0,0,600,-40,70,'lane'),seg(600,-40,1200,0,70,'lane'),seg(1200,0,1800,80,70,'lane'),seg(1800,80,2470,0,70,'lane'),
   seg(500,-40,650,-300,28),seg(1100,0,1250,260,28),seg(1700,80,1820,-220,28),seg(2100,40,2220,280,28)],
 circles:[],
 cars:[P(250,-30),P(320,35),P(780,-15),P(900,-60),P(1000,40),P(1400,20),P(1520,70),P(1650,40),P(1950,95),P(2050,-10),P(2250,30)],
 spawns:[P(650,-300),P(1250,260),P(1820,-220),P(2220,280),P(2470,0)],
 loot:[{x:560,y:-150,t:'rifle'},{x:1180,y:180,t:'med'},{x:1760,y:-120,t:'ammo'},{x:2170,y:180,t:'med'},{x:1300,y:30,t:'ammo'}],
 exit:P(2400,0),exitName:'Maintenance room',ambient:22,horde:40,
 tools:['safe','danger','scan','sniper','flare'],
 labels:[{x:300,y:-95,t:'US-50 W'},{x:1150,y:-90,t:'W-X Freeway'},{x:700,y:-320,t:'16th St ramp'},{x:1300,y:290,t:'Ramp'},{x:1870,y:-240,t:'I-5 ramp'}]},
{name:'2 · Downtown',
 intro:'Tight streets around the Capitol and K Street. Lots of blind corners: they need your eyes.',
 route:[P(0,0),P(500,0),P(500,500),P(1100,500),P(1100,1000),P(1600,1000)],
 segs:[seg(-120,0,1720,0,45),seg(-120,500,1720,500,45),seg(-120,1000,1720,1000,45),
   seg(0,-120,0,1120,45),seg(500,-120,500,1120,45),seg(1100,-120,1100,1120,45),seg(1600,-120,1600,1120,45)],
 circles:[],
 blocks:[[0,0,500,500,'State Capitol'],[500,0,1100,500,''],[1100,0,1600,500,''],[0,500,500,1000,''],[500,500,1100,1000,''],[1100,500,1600,1000,'']],
 cars:[P(250,35),P(535,260),P(820,-35),P(1065,760),P(1350,1035),P(1635,300)],
 spawns:[P(-120,500),P(-120,1000),P(1720,0),P(1720,500),P(0,1120),P(500,1120),P(1100,-120),P(1600,-120),P(1720,1000)],
 loot:[{x:0,y:380,t:'med'},{x:800,y:500,t:'shotgun'},{x:500,y:850,t:'ammo'},{x:1350,y:500,t:'med'},{x:1100,y:200,t:'ammo'},{x:1400,y:1000,t:'rifle'}],
 exit:P(1600,1000),exitName:'Safehouse',ambient:28,horde:36,
 tools:['safe','danger','scan','sniper','flare'],
 labels:[{x:800,y:470,t:'K Street'},{x:800,y:-30,t:'L Street'},{x:500,y:-140,t:'10th St'}]},
{name:'3 · Old Sacramento & Tower Bridge',
 intro:'Boardwalks lead to the gold bridge. Raise Tower Bridge to cut off a horde, but make sure the squad is across first.',
 route:[P(0,0),P(500,0),P(800,200),P(1300,200),P(1600,200)],
 segs:[seg(-150,0,500,0,50),seg(500,0,800,200,50),seg(800,200,950,200,45,'deck'),seg(950,200,1150,200,45,'lift'),seg(1150,200,1300,200,45,'deck'),seg(1300,200,1660,200,55),
   seg(250,0,250,-300,35),seg(650,100,600,450,35),seg(1450,200,1450,-150,35),seg(1450,200,1500,520,35)],
 circles:[],river:[850,1250],
 cars:[P(120,10),P(380,-20),P(1380,215),P(1550,180)],
 spawns:[P(250,-300),P(600,450),P(1450,-150),P(1500,520),P(-150,0)],
 loot:[{x:250,y:-200,t:'ammo'},{x:615,y:380,t:'shotgun'},{x:1450,y:-80,t:'med'},{x:1485,y:440,t:'ammo'}],
 exit:P(1600,200),exitName:'West Sac stairwell',ambient:26,horde:32,
 tools:['safe','danger','scan','sniper','flare','heli','bridge'],
 labels:[{x:200,y:-70,t:'Old Sacramento'},{x:1050,y:140,t:'Tower Bridge'},{x:1050,y:430,t:'Sacramento River'}]},
{name:'4 · Ballpark Holdout (Finale)',
 intro:'Reach the ballpark, use the calm to set up, then hold out until the rescue chopper lands.',
 route:[P(0,0),P(520,0),P(800,0)],
 segs:[seg(-150,0,520,0,55),seg(800,-280,800,-600,40),seg(800,280,800,600,40),seg(1080,0,1400,0,40)],
 circles:[{x:800,y:0,r:300}],holdout:true,
 cars:[P(200,15),P(380,-20)],
 spawns:[P(800,-600),P(800,600),P(1400,0),P(-150,0)],
 gates:[{name:'North',x:800,y:-600},{name:'South',x:800,y:600},{name:'East',x:1400,y:0},{name:'West',x:-150,y:0}],
 loot:[{x:700,y:-150,t:'ammo'},{x:910,y:140,t:'ammo'},{x:800,y:220,t:'med'},{x:650,y:100,t:'rifle'},{x:960,y:-120,t:'med'}],
 exit:null,ambient:6,horde:0,
 tools:['safe','danger','scan','sniper','flare','heli','lights'],
 labels:[{x:800,y:-330,t:'North gate'},{x:800,y:330,t:'South gate'},{x:1150,y:-30,t:'East gate'},{x:300,y:-80,t:'West approach'}]}
];

const TOOLS={
 safe:{em:'🟢',name:'Safe',tap:true},
 danger:{em:'🔴',name:'Danger',tap:true},
 scan:{em:'🔍',name:'Scan loot',tap:true,cd:6},
 sniper:{em:'🎯',name:'Sniper',tap:true,cd:.7},
 flare:{em:'🔥',name:'Flare',tap:true,cd:20},
 heli:{em:'🚁',name:'Heli strike',tap:true,cd:40},
 bridge:{em:'🌉',name:'Raise bridge',tap:false,cd:30},
 lights:{em:'💡',name:'Lights',tap:false,cd:25}
};
const GUNS={pistol:{d:12,rate:.42,rng:190,n:'Pistol'},rifle:{d:24,rate:.16,rng:250,n:'Rifle'},shotgun:{d:34,rate:.75,rng:150,n:'Shotgun'}};

function newSquad(){return[
 {name:'Rosa',role:'Nurse',trait:'Medic',col:'#7fd1ff',trust:60,hp:100,max:100,spd:60,aim:.8,med:true},
 {name:'Duke',role:'Trucker',trait:'Hothead',col:'#ff9f6e',trust:55,hp:120,max:120,spd:58,aim:.78,med:false},
 {name:'Kai',role:'Skater',trait:'Coward',col:'#b8ff7a',trust:65,hp:80,max:80,spd:70,aim:.7,med:false},
 {name:'Walt',role:'Old Vet',trait:'Stubborn',col:'#e0c3ff',trust:40,hp:100,max:100,spd:56,aim:.97,med:false}
].map(s=>Object.assign(s,{gun:'pistol',ammo:0,alive:true}));}

// ===== State =====
let L,li=0,squad=newSquad(),zombies=[],loots=[],pings=[],fx=[],texts=[],heliStrikes=[],cds={};
let sniperShots=8,bridgeUp=0,flare=null,lightsT=0,phase='play',holdT=0,waveT=0,wave=0,tanks=0,hordeT=0,spawnT=0;
let kills=0,levelTime=0,pan={x:0,y:0},cam={x:0,y:0},tool='safe',running=false,snapshot=null,heliPad=null,holdSpot=null,nextId=1;

function centroid(arr){if(!arr.length)return P(0,0);let x=0,y=0;arr.forEach(a=>{x+=a.x;y+=a.y});return P(x/arr.length,y/arr.length);}
function nearest(arr,p){let b=null,bd=1e9;for(const a of arr){const d=dist(a,p);if(d<bd){bd=d;b=a;}}return b;}
const aliveSquad=()=>squad.filter(s=>s.alive);

// ===== Walkable space: union of capsules + circles =====
function inLift(p){return L.river&&p.x>952&&p.x<1148&&Math.abs(p.y-200)<50;}
function walk(p){
 let best=null,bd=1e9;
 for(const s of L.segs){
  if(s.flag==='lift'&&bridgeUp>0)continue;
  const q=nearestOnSeg(p,s.a,s.b),d=Math.hypot(p.x-q.x,p.y-q.y);
  if(d<=s.r)return null;
  if(d-s.r<bd){bd=d-s.r;best={q,d,r:s.r};}
 }
 for(const c of L.circles){const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<=c.r)return null;if(d-c.r<bd){bd=d-c.r;best={q:c,d,r:c.r};}}
 if(!best)return null;
 const k=(best.r-.5)/best.d;return{x:best.q.x+(p.x-best.q.x)*k,y:best.q.y+(p.y-best.q.y)*k};
}
function moveTo(e,tx,ty,spd,dt){
 const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
 if(d>1){const st=Math.min(d,spd*dt);e.x+=dx/d*st;e.y+=dy/d*st;}
 for(const c of L.cars){const r=24+(e.r||8),d2=dist(e,c);if(d2<r&&d2>0){e.x=c.x+(e.x-c.x)/d2*r;e.y=c.y+(e.y-c.y)/d2*r;}}
 const q=walk(e);if(q){e.x=q.x;e.y=q.y;}
}

// ===== Level flow =====
function startLevel(i){
 li=i;L=LEVELS[i];zombies=[];pings=[];fx=[];texts=[];heliStrikes=[];flare=null;bridgeUp=0;lightsT=0;
 loots=L.loot.map(o=>({...o,revealed:false,taken:false}));
 snapshot=JSON.stringify(squad);
 squad.forEach((s,k)=>{s.x=L.route[0].x-40+(k%2)*30;s.y=L.route[0].y-15+Math.floor(k/2)*30;s.r=8;s.wp=1;s.cd=0;s.safe=null;s.danger=[];s.hurtCD=0;s.barkCD=0;s.mode='';});
 cds={};sniperShots=L.holdout?12:8;hordeT=L.horde?18:1e9;spawnT=0;kills=0;levelTime=0;pan={x:0,y:0};
 phase=L.holdout?'approach':'play';holdT=0;waveT=0;wave=0;tanks=0;heliPad=null;holdSpot=null;
 const c=centroid(aliveSquad());cam.x=c.x;cam.y=c.y;
 let tries=0;
 while(zombies.length<(L.ambient||6)*1.5&&tries++<500){
  const s=L.segs[Math.floor(Math.random()*L.segs.length)];if(s.flag==='lift')continue;
  const t=Math.random(),p=P(s.a.x+(s.b.x-s.a.x)*t,s.a.y+(s.b.y-s.a.y)*t);
  if(dist(p,L.route[0])>450)spawnZ(p.x,p.y,{});
 }
 tool='safe';buildTools();buildCards();toast(L.name,2.5);running=true;hideOv();
}
function spawnZ(x,y,o){
 const z={x:x+rnd(-25,25),y:y+rnd(-25,25),tank:!!o.tank,horde:!!o.horde,stun:0,wander:null};
 z.hp=z.max=z.tank?700:30;z.r=z.tank?20:9;z.spd=z.tank?50:rnd(46,60)*(z.horde?1.3:1);
 const q=walk(z);if(q){z.x=q.x;z.y=q.y;}zombies.push(z);return z;
}
function farSpawn(){const a=aliveSquad();const ok=L.spawns.filter(sp=>a.every(s=>dist(s,sp)>380));return ok.length?ok[Math.floor(Math.random()*ok.length)]:null;}
function aheadSpawn(){const a=aliveSquad(),c=centroid(a);const ok=L.spawns.filter(sp=>a.every(s=>dist(s,sp)>380));if(!ok.length)return null;
 const goal=L.exit||L.route[L.route.length-1];ok.sort((p,q)=>(dist(p,c)+dist(p,goal)*.5)-(dist(q,c)+dist(q,goal)*.5));return ok[0];}
function dirWord(p){const c=centroid(aliveSquad());const a=Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI;
 const names=['east','south-east','south','south-west','west','north-west','north','north-east'];return 'from the '+names[(Math.round(a/45)+8)%8];}

// ===== Pings & trust =====
function obeyChance(s,type){
 let c=s.trust/100+.15;
 if(s.trait==='Stubborn')c=s.trust>=70?1:s.trust/160;
 if(s.trait==='Hothead'&&type==='danger')c*=.5;
 if(s.trait==='Coward')c*=type==='danger'?1.3:1.1;
 return clamp(c,0,1);
}
function trust(s,amt,msg){s.trust=clamp(s.trust+amt,0,100);if(msg)bark(s,msg,amt>0?'#9f9':'#f99',true);}
function placePing(type,x,y){
 const hit=pings.find(p=>p.type===type&&Math.hypot(p.x-x,p.y-y)<p.r*.6);
 if(hit){removePing(hit);return;}
 if(type==='safe')pings.filter(p=>p.type==='safe').forEach(removePing);
 if(type==='danger'){const d=pings.filter(p=>p.type==='danger');if(d.length>=2)removePing(d[0]);}
 const p={id:nextId++,type,x,y,r:type==='safe'?70:110,t:type==='safe'?12:15,T:type==='safe'?12:15,maxZ:0,ob:[],hurt:new Set()};
 pings.push(p);
 if(type==='safe'&&L.holdout&&phase!=='approach'&&dist(p,L.circles[0])<L.circles[0].r)holdSpot=P(x,y);
 for(const s of aliveSquad()){
  if(Math.random()<obeyChance(s,type)){p.ob.push(s);if(type==='safe')s.safe=p.id;else s.danger.push(p.id);bark(s,type==='safe'?'On it':'Holding');}
  else bark(s,['Nah.','I got this.','Not listening.'][Math.floor(Math.random()*3)],'#fc9');
 }
}
function removePing(p){p.t=0;clearPing(p);}
function clearPing(p){for(const s of squad){if(s.safe===p.id)s.safe=null;s.danger=s.danger.filter(i=>i!==p.id);}}
function resolvePing(p){
 if(p.type==='danger'){
  for(const s of p.ob){if(!s.alive)continue;if(p.maxZ>=3)trust(s,6,'Good call');else if(p.maxZ===0)trust(s,-4,'Nothing there...');}
 }else{for(const s of p.ob)if(s.alive&&!p.hurt.has(s))trust(s,2);}
 clearPing(p);
}

// ===== Survivors =====
function bark(s,txt,col,force){if(!force&&s.barkCD>0)return;s.barkCD=1.2;texts.push({x:s.x,y:s.y-20,t:1.6,txt,col:col||'#fff'});}
function wants(s,o){if(o.t==='med')return !s.med;if(o.t==='ammo')return s.gun!=='pistol'&&s.ammo<80;return s.gun==='pistol'||s.ammo<20;}
function take(s,o){
 o.taken=true;
 if(o.t==='med')s.med=true;else if(o.t==='ammo')s.ammo+=s.gun==='shotgun'?20:60;else{s.gun=o.t;s.ammo=o.t==='shotgun'?30:120;}
 if(o.revealed)trust(s,2,'Good eye!');else bark(s,'Found something');
}
function goalPoint(s){
 if(L.holdout&&phase!=='approach'){if(phase==='rescue')return heliPad;return holdSpot||L.circles[0];}
 return L.route[Math.min(s.wp,L.route.length-1)];
}
function routeAhead(s,look){ // point on the route polyline a bit ahead of s (keeps them off corners)
 const R=L.route;let i=Math.max(1,Math.min(s.wp,R.length-1));
 let q=nearestOnSeg(s,R[i-1],R[i]),left=look;
 while(left>0){const d=dist(q,R[i]);if(d>=left){const k=left/d;return P(q.x+(R[i].x-q.x)*k,q.y+(R[i].y-q.y)*k);}left-=d;q=R[i];if(i>=R.length-1)return R[i];i++;}
 return q;
}
function thinkSurvivor(s,dt,alive){
 s.hurtCD-=dt;s.cd-=dt;s.barkCD-=dt;
 s.stuckT=(s.stuckT||0)+dt;if(s.stuckT>1.2){if(s.lp&&dist(s,s.lp)<8&&s.mode!=='hold'&&s.mode!=='wait')s.unstick=1.2;s.lp=P(s.x,s.y);s.stuckT=0;}
 if(s.unstick>0)s.unstick-=dt;
 const zs=zombies.filter(z=>z.hp>0&&dist(z,s)<280);
 let tx=s.x,ty=s.y,spd=s.spd,mode='route',done=false;
 const Wp=goalPoint(s);
 if(s.med){
  const hurt=alive.filter(o=>o.hp<o.max*.45).sort((a,b)=>a.hp-b.hp)[0];
  if(hurt&&(s.trait==='Medic'||hurt===s)){
   if(dist(s,hurt)<22){hurt.hp=Math.min(hurt.max,hurt.hp+60);s.med=false;bark(hurt,'Patched up','#9f9',true);}
   else{tx=hurt.x;ty=hurt.y;done=true;mode='heal';}
  }
 }
 if(!done&&s.trait==='Coward'){
  const close=zs.filter(z=>dist(z,s)<110);
  if(close.length>=2){let ax=0,ay=0;close.forEach(z=>{ax+=s.x-z.x;ay+=s.y-z.y});const m=Math.hypot(ax,ay)||1;tx=s.x+ax/m*100;ty=s.y+ay/m*100;spd*=1.2;done=true;mode='flee';bark(s,'Nope nope nope','#fc9');}
 }
 if(!done){
  for(const p of pings){
   if(!s.danger.includes(p.id))continue;
   const onPath=nearestOnSeg(p,s,Wp);
   if(dist(onPath,p)<p.r+20||dist(s,p)<p.r+40){
    if(dist(s,p)<p.r+40){const d=dist(s,p)||1;tx=p.x+(s.x-p.x)/d*(p.r+55);ty=p.y+(s.y-p.y)/d*(p.r+55);}
    done=true;mode='hold';break;
   }
  }
 }
 if(!done&&s.safe){const p=pings.find(q=>q.id===s.safe);if(p){if(dist(s,p)>22){tx=p.x;ty=p.y;spd*=1.15;}done=true;mode='safe';}}
 if(!done){
  const lt=loots.filter(o=>!o.taken&&(o.revealed||dist(o,s)<70)&&dist(o,s)<280&&wants(s,o)).sort((a,b)=>dist(a,s)-dist(b,s))[0];
  if(lt){tx=lt.x;ty=lt.y;done=true;mode='loot';if(dist(s,lt)<18)take(s,lt);}
 }
 if(!done&&s.trait==='Hothead'){const nz=nearest(zs.filter(z=>!z.tank),s);if(nz&&dist(nz,s)<150&&dist(nz,centroid(alive))<200){tx=nz.x;ty=nz.y;done=true;mode='charge';if(Math.random()<dt)bark(s,'Come get some!','#fc9');}}
 if(!done){
  const ra=(L.holdout&&phase!=='approach')?Wp:routeAhead(s,70);tx=ra.x;ty=ra.y;
  const c=centroid(alive);
  if(alive.length>1&&dist(s,c)>150){if(dist(Wp,s)<dist(Wp,c)){tx=s.x;ty=s.y;mode='wait';}else spd*=1.25;}
 }
 if(!(L.holdout&&phase!=='approach')&&s.wp<L.route.length-1){const A=L.route[s.wp],B=L.route[s.wp+1];if(dist(s,A)<45||dist(s,B)<dist(A,B))s.wp++;}
 if(s.unstick>0&&!(L.holdout&&phase!=='approach')){const ra=routeAhead(s,40);tx=ra.x;ty=ra.y;}
 if(mode==='route'&&zs.some(z=>dist(z,s)<GUNS[s.gun].rng))spd*=.55; // slow down while fighting
 moveTo(s,tx,ty,spd,dt);
 shoot(s,zs);
 s.mode=mode;
}
function shoot(s,zs){
 if(s.cd>0)return;
 if(s.gun!=='pistol'&&s.ammo<=0){s.gun='pistol';bark(s,"I'm out!",'#fc9',true);}
 const g=GUNS[s.gun];
 const t=nearest(zs.filter(z=>dist(z,s)<g.rng),s);if(!t)return;
 s.cd=g.rate;if(s.gun!=='pistol')s.ammo--;
 fx.push({type:'tracer',x:s.x,y:s.y,x2:t.x,y2:t.y,t:.08});
 if(Math.random()<s.aim){
  dmgZ(t,g.d);
  if(s.gun==='shotgun')zombies.filter(z=>z!==t&&dist(z,t)<45).slice(0,2).forEach(z=>dmgZ(z,g.d));
 }
}
function dmgZ(z,d){if(z.hp<=0)return;z.hp-=d;if(z.hp<=0){kills++;fx.push({type:'splat',x:z.x,y:z.y,t:.6,r:z.r});}}
function hurt(s,amt){
 if(!s.alive)return;
 s.hp-=amt;
 if(s.hurtCD<=0){
  s.hurtCD=3;
  const p=pings.find(q=>q.type==='safe'&&q.ob.includes(s)&&dist(q,s)<q.r+30);
  if(p&&!p.hurt.has(s)){p.hurt.add(s);trust(s,-6,'You said it was safe!');}
 }
 if(s.hp<=0){s.alive=false;s.hp=0;toast(s.name+' is down!',2);fx.push({type:'splat',x:s.x,y:s.y,t:1.5,r:12,col:'#a22'});}
}

// ===== Zombies =====
function thinkZombie(z,dt,alive){
 if(z.stun>0){z.stun-=dt;return;}
 let t=null;
 if(flare&&!z.tank&&dist(z,flare)<420)t=flare;
 else{const n=nearest(alive,z);const sight=z.horde?3000:z.tank?500:230;if(n&&dist(n,z)<sight)t=n;}
 z.st=(z.st||0)+dt;if(z.st>1.5){if(z.lp&&dist(z,z.lp)<6&&t)z.unst=1.5;z.lp=P(z.x,z.y);z.st=0;}
 if(z.unst>0){z.unst-=dt;if(!z.wander||dist(z,z.wander)<20)z.wander=P(z.x+rnd(-200,200),z.y+rnd(-200,200));t=z.wander;}
 if(t)moveTo(z,t.x,t.y,z.spd,dt);
 else{if(!z.wander||dist(z,z.wander)<20||Math.random()<dt*.1)z.wander=P(z.x+rnd(-150,150),z.y+rnd(-150,150));moveTo(z,z.wander.x,z.wander.y,z.spd*.35,dt);}
 for(const s of alive)if(dist(s,z)<z.r+10)hurt(s,(z.tank?30:12)*dt);
}
function separate(){
 const all=zombies.concat(aliveSquad());
 for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
  const a=all[i],b=all[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=(a.r||8)+(b.r||8);
  if(d<m&&d>0){const push=(m-d)/2;a.x-=dx/d*push;a.y-=dy/d*push;b.x+=dx/d*push;b.y+=dy/d*push;}
 }
}

// ===== Spawning & holdout =====
function spawning(dt){
 if(!L.holdout||phase==='approach'){
  spawnT-=dt;
  if(spawnT<=0&&zombies.length<L.ambient){spawnT=1.6;const sp=farSpawn();if(sp)spawnZ(sp.x,sp.y,{});}
  if(L.horde){hordeT-=dt;if(hordeT<=0){hordeT=L.horde;const sp=zombies.length<L.ambient*2?aheadSpawn():null;if(sp){for(let i=0;i<14;i++)spawnZ(sp.x,sp.y,{horde:true});toast('HORDE incoming '+dirWord(sp)+'!',2.5);fx.push({type:'warn',x:sp.x,y:sp.y,t:4});}}}
 }
 if(L.holdout)holdout(dt);
}
function waveFrom(n,tank){
 const g=L.gates[Math.floor(Math.random()*L.gates.length)];
 if(tank){spawnZ(g.x,g.y,{tank:true,horde:true});toast('TANK at the '+g.name+' gate!',2.5);}
 else{for(let i=0;i<n;i++)spawnZ(g.x,g.y,{horde:true});toast('Wave from the '+g.name+' gate!',2);}
 fx.push({type:'warn',x:g.x,y:g.y,t:3});
}
function holdout(dt){
 const a=aliveSquad(),f=L.circles[0];
 if(phase==='approach'){if(a.length&&a.every(s=>dist(s,f)<f.r-20)){phase='setup';holdT=20;toast('Ballpark reached! 20s to set up. Ping a hold spot.',3);}}
 else if(phase==='setup'){holdT-=dt;if(holdT<=0){phase='holdout';holdT=90;waveT=2;toast('Rescue called! Hold out for 90 seconds!',3);}}
 else if(phase==='holdout'){
  holdT-=dt;waveT-=dt;
  if(waveT<=0){waveT=13;wave++;waveFrom(4+wave,false);}
  if(tanks===0&&holdT<60){tanks=1;waveFrom(0,true);}
  if(tanks===1&&holdT<25){tanks=2;waveFrom(0,true);}
  if(holdT<=0){phase='rescue';heliPad=P(1010,150);waveT=4;toast('Chopper is down. Get them to it!',3);}
 }else if(phase==='rescue'){
  waveT-=dt;if(waveT<=0){waveT=9;wave++;waveFrom(5+wave,false);}
  if(a.length&&a.every(s=>dist(s,heliPad)<55))win();
 }
}

// ===== Powers =====
function useTool(w){
 if(!running)return;
 const T=TOOLS[tool];if(!T||!T.tap)return;
 if((cds[tool]||0)>0)return;
 if(tool==='safe'||tool==='danger'){placePing(tool,w.x,w.y);return;}
 if(tool==='scan'){
  const found=loots.filter(o=>!o.taken&&dist(o,w)<260);found.forEach(o=>o.revealed=true);
  fx.push({type:'ring',x:w.x,y:w.y,r:260,t:.8,col:'#ffd479'});cds.scan=T.cd;
  toast(found.length?found.length+' item'+(found.length>1?'s':'')+' marked':'Nothing here',1.2);return;
 }
 if(tool==='sniper'){
  if(sniperShots<=0){toast('Out of sniper rounds',1.2);return;}
  const z=nearest(zombies.filter(z=>z.hp>0&&dist(z,w)<45),w);if(!z)return;
  sniperShots--;cds.sniper=T.cd;
  fx.push({type:'snipe',x:z.x,y:z.y,t:.35});
  const near=nearest(aliveSquad(),z);
  dmgZ(z,z.tank?160:999);
  if(near&&dist(near,z)<90)trust(near,3,'Nice shot, Eye!');
  return;
 }
 if(tool==='flare'){flare={x:w.x,y:w.y,t:8};cds.flare=T.cd;return;}
 if(tool==='heli'){heliStrikes.push({x:w.x,y:w.y,t:1.4});cds.heli=T.cd;toast('Chopper inbound...',1.2);return;}
}
function instantTool(k){
 if(!running||!L.tools.includes(k)||(cds[k]||0)>0)return;
 if(k==='bridge'){
  bridgeUp=10;cds.bridge=TOOLS.bridge.cd;toast('Tower Bridge RAISED',2);
  zombies.forEach(z=>{if(inLift(z)){z.hp=0;kills++;fx.push({type:'splash',x:z.x,y:z.y,t:.8});}});
  aliveSquad().forEach(s=>{if(inLift(s)){s.alive=false;s.hp=0;toast(s.name+' fell into the river!',2.5);}});
 }
 if(k==='lights'){
  lightsT=4;cds.lights=TOOLS.lights.cd;toast('Stadium lights ON',1.5);
  const f=L.circles[0];zombies.forEach(z=>{if(dist(z,f)<f.r+180)z.stun=z.tank?2:4;});
 }
}
function boom(h){
 fx.push({type:'boom',x:h.x,y:h.y,t:.6});
 zombies.forEach(z=>{if(dist(z,h)<130)dmgZ(z,z.tank?300:999);});
 aliveSquad().forEach(s=>{if(dist(s,h)<130){hurt(s,35);trust(s,-10,'WATCH IT, EYE!');}});
}

// ===== Main update =====
function update(dt){
 levelTime+=dt;
 for(const k in cds)cds[k]=Math.max(0,cds[k]-dt);
 for(const p of pings){p.t-=dt;if(p.type==='danger'){const c=zombies.filter(z=>z.hp>0&&dist(z,p)<p.r).length;p.maxZ=Math.max(p.maxZ,c);}if(p.t<=0&&!p.resolved){p.resolved=true;resolvePing(p);}}
 pings=pings.filter(p=>p.t>0);
 if(bridgeUp>0){bridgeUp-=dt;if(bridgeUp<=0)toast('Tower Bridge lowered',1.5);}
 if(flare){flare.t-=dt;if(flare.t<=0)flare=null;}
 if(lightsT>0)lightsT-=dt;
 for(const h of heliStrikes){h.t-=dt;if(h.t<=0&&!h.done){h.done=true;boom(h);}}
 heliStrikes=heliStrikes.filter(h=>h.t>-.6);
 spawning(dt);
 const alive=aliveSquad();
 for(const s of alive)thinkSurvivor(s,dt,alive);
 for(const z of zombies)thinkZombie(z,dt,alive);
 separate();
 zombies=zombies.filter(z=>z.hp>0);
 fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
 texts.forEach(t=>{t.t-=dt;t.y-=14*dt;});texts=texts.filter(t=>t.t>0);
 const a=aliveSquad();
 if(!a.length){lose();return;}
 if(!L.holdout&&a.every(s=>dist(s,L.exit)<75))complete();
}

// ===== Rendering =====
function render(){
 ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,W,H);
 if(!L)return;
 const a=aliveSquad(),c=a.length?centroid(a):cam;
 cam.x+=(c.x+pan.x-cam.x)*.08;cam.y+=(c.y+pan.y-cam.y)*.08;
 sc=clamp(Math.min(W,H)/650,.55,1.5);
 ctx.save();ctx.translate(W/2,H/2+20);ctx.scale(sc,sc);ctx.translate(-cam.x,-cam.y);
 if(L.river){ctx.fillStyle='#123048';ctx.fillRect(L.river[0],-3000,L.river[1]-L.river[0],6000);}
 if(L.blocks)for(const b of L.blocks){ctx.fillStyle=b[4]?'#25303a':'#18212a';ctx.fillRect(b[0]+50,b[1]+50,b[2]-b[0]-100,b[3]-b[1]-100);

 for(const f of L.circles){ctx.fillStyle='#1d4a2a';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();
  ctx.fillStyle='#6b4a2c';ctx.beginPath();ctx.moveTo(f.x-150,f.y);ctx.lineTo(f.x,f.y-150);ctx.lineTo(f.x+150,f.y);ctx.lineTo(f.x,f.y+150);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1d4a2a';ctx.beginPath();ctx.moveTo(f.x-110,f.y);ctx.lineTo(f.x,f.y-110);ctx.lineTo(f.x+110,f.y);ctx.lineTo(f.x,f.y+110);ctx.closePath();ctx.fill();
  if(lightsT>0){ctx.fillStyle='rgba(255,255,220,'+(.25*lightsT/4)+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r+180,0,7);ctx.fill();}}
 ctx.lineCap='round';
 for(const s of L.segs){
  if(s.flag==='lift'){ctx.strokeStyle=bridgeUp>0?'#3b2f0a':'#c9a227';}else if(s.flag==='deck')ctx.strokeStyle='#a8871f';else ctx.strokeStyle=L.circles.length&&s.r<45?'#3a3125':'#2b323b';
  ctx.lineWidth=s.r*2;ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke();
 }
 ctx.setLineDash([18,22]);ctx.strokeStyle='#5a6470';ctx.lineWidth=2;
 for(const s of L.segs)if(s.flag==='lane'){ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke();}
 ctx.setLineDash([]);
 if(L.river&&bridgeUp>0){ctx.fillStyle='#ffd479';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('RAISED '+Math.ceil(bridgeUp),1050,205);}
 ctx.fillStyle='#8a9aab';ctx.font='bold 16px system-ui';ctx.textAlign='center';
 for(const l of L.labels)ctx.fillText(l.t,l.x,l.y);
 for(const c2 of L.cars){ctx.fillStyle='#4a3f3a';ctx.save();ctx.translate(c2.x,c2.y);ctx.rotate((c2.x*7%10)/10);ctx.fillRect(-26,-13,52,26);ctx.fillStyle='#2c2522';ctx.fillRect(-12,-11,22,22);ctx.restore();}
 if(L.exit){ctx.fillStyle='#1f6f3a';ctx.fillRect(L.exit.x-40,L.exit.y-40,80,80);ctx.strokeStyle='#5f5';ctx.lineWidth=3;ctx.strokeRect(L.exit.x-40,L.exit.y-40,80,80);
  ctx.fillStyle='#bfb';ctx.font='bold 14px system-ui';ctx.fillText(L.exitName,L.exit.x,L.exit.y-50);}
 if(heliPad){ctx.strokeStyle='#ffd479';ctx.lineWidth=4;ctx.beginPath();ctx.arc(heliPad.x,heliPad.y,55,0,7);ctx.stroke();ctx.fillStyle='#ffd479';ctx.font='bold 26px system-ui';ctx.fillText('H',heliPad.x,heliPad.y+9);}
 if(holdSpot&&phase!=='rescue'&&phase!=='approach'){ctx.strokeStyle='#7fd1ff';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(holdSpot.x,holdSpot.y,40,0,7);ctx.stroke();ctx.setLineDash([]);}
 const LI={med:'✚',ammo:'▮',rifle:'R',shotgun:'S'};
 for(const o of loots){if(o.taken)continue;
  if(o.revealed){ctx.fillStyle='#ffd479';ctx.beginPath();ctx.arc(o.x,o.y,11,0,7);ctx.fill();ctx.fillStyle='#1a1300';ctx.font='bold 13px system-ui';ctx.fillText(LI[o.t],o.x,o.y+5);}
  else{ctx.fillStyle='rgba(255,212,121,.25)';ctx.font='bold 14px system-ui';ctx.fillText('?',o.x,o.y+5);}}
 for(const p of pings){
  ctx.fillStyle=p.type==='safe'?'rgba(80,220,120,.16)':'rgba(240,70,70,.16)';ctx.strokeStyle=p.type==='safe'?'#5d8':'#f55';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r,-Math.PI/2,-Math.PI/2+Math.PI*2*(p.t/p.T));ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle;ctx.font='bold 13px system-ui';ctx.fillText(p.type==='safe'?'SAFE':'DANGER',p.x,p.y+5);}
 if(flare){ctx.fillStyle='#ff7a2a';ctx.beginPath();ctx.arc(flare.x,flare.y,6+Math.random()*4,0,7);ctx.fill();ctx.strokeStyle='rgba(255,122,42,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(flare.x,flare.y,420,0,7);ctx.stroke();}
 for(const h of heliStrikes)if(!h.done){ctx.strokeStyle='#ffd479';ctx.setLineDash([8,6]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.x,h.y,130,0,7);ctx.stroke();ctx.setLineDash([]);}
 for(const z of zombies){ctx.fillStyle=z.tank?'#b33':z.horde?'#8a6b4e':'#6b8f5e';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();
  if(z.stun>0){ctx.strokeStyle='#9cf';ctx.lineWidth=2;ctx.stroke();}
  if(z.tank){ctx.fillStyle='#300';ctx.fillRect(z.x-20,z.y-30,40,5);ctx.fillStyle='#f44';ctx.fillRect(z.x-20,z.y-30,40*z.hp/z.max,5);}}

  ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(s.x,s.y,9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

  ctx.fillStyle='#300';ctx.fillRect(s.x-12,s.y+12,24,3);ctx.fillStyle='#5f5';ctx.fillRect(s.x-12,s.y+12,24*s.hp/s.max,3);
  if(s.safe){ctx.fillStyle='#5d8';ctx.beginPath();ctx.arc(s.x+11,s.y-8,3,0,7);ctx.fill();}
  if(s.danger.length){ctx.fillStyle='#f55';ctx.beginPath();ctx.arc(s.x-11,s.y-8,3,0,7);ctx.fill();}}
 for(const f of fx){
  if(f.type==='tracer'){ctx.strokeStyle='rgba(255,240,180,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();}
  else if(f.type==='splat'){ctx.fillStyle=f.col||'rgba(90,120,70,.5)';ctx.globalAlpha=Math.min(1,f.t);ctx.beginPath();ctx.arc(f.x,f.y,f.r+4,0,7);ctx.fill();ctx.globalAlpha=1;}
  else if(f.type==='ring'){ctx.strokeStyle=f.col;ctx.globalAlpha=f.t;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-f.t*.5),0,7);ctx.stroke();ctx.globalAlpha=1;}
  else if(f.type==='snipe'){ctx.strokeStyle='#f33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,16,0,7);ctx.moveTo(f.x-22,f.y);ctx.lineTo(f.x+22,f.y);ctx.moveTo(f.x,f.y-22);ctx.lineTo(f.x,f.y+22);ctx.stroke();}
  else if(f.type==='boom'){ctx.fillStyle='rgba(255,170,60,'+f.t+')';ctx.beginPath();ctx.arc(f.x,f.y,130*(1.2-f.t),0,7);ctx.fill();}

  else if(f.type==='warn'){ctx.strokeStyle='rgba(255,80,80,'+(.5+.5*Math.sin(f.t*10))+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,60,0,7);ctx.stroke();ctx.fillStyle='#f66';ctx.font='bold 18px system-ui';ctx.fillText('!',f.x,f.y+6);}
 }
 for(const t of texts){ctx.globalAlpha=Math.min(1,t.t);ctx.fillStyle=t.col;ctx.font='bold 12px system-ui';ctx.fillText(t.txt,t.x,t.y);ctx.globalAlpha=1;}
 ctx.restore();
 if(running)for(const f of fx)if(f.type==='warn'){ // off-screen arrow
  const sx=(f.x-cam.x)*sc+W/2,sy=(f.y-cam.y)*sc+H/2+20;
  if(sx<0||sx>W||sy<0||sy>H){const ang=Math.atan2(sy-H/2,sx-W/2),ex=W/2+Math.cos(ang)*(Math.min(W,H)/2-40),ey=H/2+Math.sin(ang)*(Math.min(W,H)/2-40);
   ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);ctx.fillStyle='#f55';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();ctx.restore();}}
}

// ===== HUD =====
const $=id=>document.getElementById(id);
function buildTools(){
 const box=$('tools');box.innerHTML='';
 for(const k of L.tools){const T=TOOLS[k];const b=document.createElement('button');b.className='tool';b.dataset.k=k;
  b.innerHTML='<span class="em">'+T.em+'</span><span class="nm">'+T.name+'</span>';
  b.onclick=()=>{if(T.tap){tool=k;}else instantTool(k);refreshTools();};box.appendChild(b);}
 refreshTools();
}
function refreshTools(){
 for(const b of $('tools').children){const k=b.dataset.k,T=TOOLS[k];b.classList.toggle('sel',k===tool&&T.tap);
  let cd=b.querySelector('.cd');const left=cds[k]||0;
  if(left>0){if(!cd){cd=document.createElement('span');cd.className='cd';b.appendChild(cd);}cd.textContent=Math.ceil(left);}else if(cd)cd.remove();

}
function buildCards(){$('squad').innerHTML=squad.map((s,i)=>'<div class="card" id="cd'+i+'"></div>').join('');}
function refreshHUD(){
 $('title').textContent=L.name;
 let o=L.intro;
 if(L.holdout){if(phase==='approach')o='Get the squad into the ballpark.';else if(phase==='setup')o='Set up! Rescue call in '+Math.ceil(holdT)+'s. Ping a hold spot, scan for ammo.';else if(phase==='holdout')o='HOLD OUT: '+Math.ceil(holdT)+'s until the chopper lands. Wave '+wave;else if(phase==='rescue')o='Get everyone to the chopper (H)!';}
 else o='Goal: '+L.exitName+'. Next horde in ~'+Math.ceil(hordeT)+'s';
 $('obj').textContent=o;
 const ML={heal:'healing',flee:'fleeing',hold:'holding',safe:'going to Safe',loot:'grabbing loot',charge:'charging',wait:'waiting for group',route:'moving'};
 squad.forEach((s,i)=>{const el=$('cd'+i);if(!el)return;el.className='card'+(s.alive?'':' dead');
  el.innerHTML='<b style="color:'+s.col+'">'+s.name+'</b> '+s.trait+(s.med?' ✚':'')+'<br>'+(s.alive?GUNS[s.gun].n+(s.gun!=='pistol'?' '+s.ammo:'')+' · '+(ML[s.mode]||''):'DOWN')+
  '<div class="bar"><i style="width:'+(100*s.hp/s.max)+'%;background:#5d5"></i></div><div class="bar"><i style="width:'+s.trust+'%;background:#7fd1ff"></i></div>';});
 refreshTools();
}
let toastTO=null;
function toast(t,sec){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTO);toastTO=setTimeout(()=>el.style.opacity=0,(sec||1.5)*1000);}

// ===== Overlays =====
function showOv(html){$('ovBox').innerHTML=html;$('ov').classList.remove('hidden');running=false;}
function hideOv(){$('ov').classList.add('hidden');}
function titleScreen(){
 showOv('<h1>Eye in the Sky</h1><div style="color:#8a9aab">Sacramento · prototype (working title)</div>'+
 '<p>You\'re <b>Eye</b>, a drone operator over a fallen Sacramento. Four survivors are trying to get out. You <b>can\'t control them</b>. They do what they want to survive. You back them up.</p>'+
 '<h2>How to play</h2><ul>'+
 '<li><b>🟢 Safe</b>: tap a spot. Survivors who trust you go there. Tap it again to cancel.</li>'+
 '<li><b>🔴 Danger</b>: tap a spot. Survivors who listen won\'t walk through it.</li>'+
 '<li><b>🔍 Scan</b>: highlights guns, ammo and meds so they go grab them.</li>'+
 '<li><b>🎯 Sniper</b>: tap a zombie to pick it off (limited rounds).</li>'+
 '<li><b>🔥 Flare</b>: pulls zombies to it. <b>🚁 Heli</b>: big strike, hurts survivors too!</li>'+
 '<li>Drag the map to look around. ⌖ Center snaps back.</li></ul>'+
 '<h2>Trust</h2><p>The blue bar on each card. Good calls raise it, bad calls ("you said it was safe!") lower it. Low trust means they ignore you. <b>Walt</b> is stubborn and only listens at high trust. <b>Duke</b> charges in. <b>Kai</b> runs when scared. <b>Rosa</b> heals.</p>'+
 '<p>Anyone who dies stays dead for the rest of the run.</p>'+
 '<button class="btn" id="go">Start: Highway 50</button>'+
 '<h2>Levels</h2><p style="font-size:12px;color:#8a9aab">1 Highway 50 · 2 Downtown · 3 Tower Bridge · 4 Ballpark holdout</p>'+
 '<button class="btn alt" id="pick">Level select (testing)</button>');
 $('go').onclick=()=>{squad=newSquad();startLevel(0);};
 $('pick').onclick=levelSelect;
}
function levelSelect(){
 showOv('<h1>Level select</h1><p style="color:#8a9aab">For testing: starts with a fresh squad.</p>'+LEVELS.map((l,i)=>'<button class="btn alt" data-i="'+i+'">'+l.name+'</button>').join('')+'<button class="btn" id="back">Back</button>');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{squad=newSquad();startLevel(+b.dataset.i);});
 $('back').onclick=titleScreen;
}
function stats(){const a=aliveSquad();return '<p>Survivors: <b>'+a.length+'/4</b> ('+(a.map(s=>s.name).join(', ')||'none')+')<br>Zombies killed: '+kills+'<br>Time: '+Math.round(levelTime)+'s</p>';}
function complete(){
 running=false;
 showOv('<h1>Made it!</h1><div style="color:#8a9aab">'+L.name+'</div>'+stats()+'<p>Survivors rest up (+35 health) before the next level.</p><button class="btn" id="nx">Next: '+LEVELS[li+1].name+'</button>');
 $('nx').onclick=()=>{aliveSquad().forEach(s=>s.hp=Math.min(s.max,s.hp+35));startLevel(li+1);};
}
function win(){
 running=false;
 showOv('<h1>Rescued! 🚁</h1><p>The chopper lifts off from the ballpark.</p>'+stats()+'<button class="btn" id="again">Play again</button>');
 $('again').onclick=titleScreen;
}
function lose(){
 running=false;
 showOv('<h1>Everyone is down</h1><div style="color:#8a9aab">'+L.name+'</div><button class="btn" id="retry">Retry this level</button><button class="btn alt" id="menu">Main menu</button>');
 $('retry').onclick=()=>{squad=JSON.parse(snapshot);startLevel(li);};
 $('menu').onclick=titleScreen;
}

// ===== Input =====
let down=null;
function screenToWorld(x,y){return P((x-W/2)/sc+cam.x,(y-H/2-20)/sc+cam.y);}
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y,moved:false};});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>12)down.moved=true;if(down.moved){pan.x=down.px-dx/sc;pan.y=down.py-dy/sc;}});
cv.addEventListener('pointerup',e=>{if(down&&!down.moved)useTool(screenToWorld(e.clientX,e.clientY));down=null;});
cv.addEventListener('pointercancel',()=>down=null);
$('centerBtn').onclick=()=>{pan.x=0;pan.y=0;};

// ===== Loop =====
let last=performance.now(),hudT=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){update(dt);hudT-=dt;if(hudT<=0){hudT=.2;refreshHUD();}}
 render();requestAnimationFrame(frame);
}
L=LEVELS[0];titleScreen();requestAnimationFrame(frame);
</script>
</body></html>
